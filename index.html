<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chippi AI (Formerly Bytes AI)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px;
      color: #1f2937;
    }

    .container {
      margin-top: 48px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 40px 32px 32px;
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Instrument Serif', serif;
      color: #111827;
      font-size: 3em;
      text-align: center;
      margin: 0 0 8px 0;
      font-weight: 400;
      letter-spacing: 0.2px;
      line-height: 1;
    }

    h3 {
      margin: 0 0 24px 0;
      color: #6b7280;
      font-weight: 500;
      font-family: 'Inter', system-ui, sans-serif;
    }

    input[type="text"] {
      width: 100%;
      max-width: 560px;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      margin-bottom: 16px;
      background: #ffffff;
      font-size: 1.05em;
      color: #111827;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      font-family: 'Inter', system-ui, sans-serif;
    }

    input[type="text"]::placeholder {
      color: #9ca3af;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    button,
    #seeMoreBtn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 13px 28px;
      border-radius: 12px;
      font-size: 1.02em;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
      transition: background-color 0.2s ease, transform 0.12s ease, box-shadow 0.2s ease;
      font-family: 'Instrument Serif', serif;
    }

    button:hover,
    button:focus,
    #seeMoreBtn:hover,
    #seeMoreBtn:focus {
      background: #1d4ed8;
      outline: none;
    }

    button:active,
    #seeMoreBtn:active {
      transform: translateY(1px);
    }

    #searchResult {
      margin-top: 12px;
      width: 100%;
      min-height: 42px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 22px 20px;
      color: #374151;
      font-size: 1.03em;
      word-break: break-word;
      font-family: 'Instrument Serif', serif;
    }

    .resultCard {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      margin-bottom: 16px;
      padding: 16px 18px;
      width: 100%;
      max-width: 640px;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .resultSource {
      font-size: 0.92em;
      color: #6b7280;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .resultCard b {
      color: #111827;
      font-size: 1.02em;
      display: inline-block;
      margin-bottom: 6px;
    }

    .resultCard a {
      color: #2563eb;
      font-size: 1em;
      font-weight: 600;
      text-decoration: none;
    }

    .resultCard a:hover {
      text-decoration: underline;
    }

    @media screen and (max-width: 800px) {
      body {
        padding: 14px;
      }

      .container {
        max-width: 100vw;
        padding: 22px 16px;
        border-radius: 16px;
      }

      h1 {
        font-size: 2.3em;
      }

      input[type="text"] {
        max-width: 100%;
      }

      .resultCard {
        max-width: 100%;
      }

      #searchResult {
        padding: 14px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bytes AI</h1>
    <h3>By Siddharthan</h3>

    <input
      type="text"
      id="serper-input"
      placeholder="Text your curiosity"
      autocomplete="off"
    />
    <button onclick="callSerper()">Search</button>

    <div id="searchResult"></div>
    <button id="seeMoreBtn" style="display:none;" onclick="showMore()">See More</button>
  </div>

  <script>
    let allResults = [];
    let resultsDisplayed = 0;

    function getDomain(url) {
      try {
        return new URL(url).hostname.replace("www.", "");
      } catch {
        return "Unknown Source";
      }
    }

    async function callSerper() {
      const apiKey = "695a28c2af7ac73985cf09d13e1d53fbcf9b39cb";
      const query = document.getElementById('serper-input').value.trim();
      const srDiv = document.getElementById('searchResult');
      const seeMoreBtn = document.getElementById('seeMoreBtn');

      seeMoreBtn.style.display = 'none';
      allResults = [];
      resultsDisplayed = 0;

      if (!query) {
        srDiv.innerHTML = '⚠️ <i>Please enter a search query.</i>';
        return;
      }

      srDiv.innerHTML = '🔍 <i>Searching…</i>';

      try {
        const res = await fetch('https://google.serper.dev/search', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-KEY': apiKey
          },
          body: JSON.stringify({ q: query })
        });

        if (!res.ok) {
          const errText = await res.text();
          srDiv.innerHTML = `<span style="color:#b91c1c;">❌ <b>Error ${res.status}:</b> ${errText}</span>`;
          return;
        }

        const data = await res.json();

        if (data?.organic && data.organic.length > 0) {
          allResults = data.organic;
          resultsDisplayed = 0;
          displayResults(3);

          if (allResults.length > resultsDisplayed) {
            seeMoreBtn.style.display = '';
          }
        } else {
          srDiv.innerHTML = '<b>No results found.</b>';
        }
      } catch (e) {
        srDiv.innerHTML = `<span style="color:#b45309;">⚠️ <b>Fetch error:</b> ${e.message}</span>`;
      }
    }

    function displayResults(n) {
      const srDiv = document.getElementById('searchResult');
      let html = '';
      const end = Math.min(resultsDisplayed + n, allResults.length);

      for (let i = resultsDisplayed; i < end; i++) {
        const item = allResults[i];
        html += `
          <div class="resultCard">
            <div class="resultSource">${getDomain(item.link)}</div>
            <b>${item.title || ''}</b><br>
            <span>${item.snippet || ''}</span><br><br>
            <a href="${item.link}" target="_blank" rel="noopener noreferrer">Visit link</a>
          </div>
        `;
      }

      if (resultsDisplayed === 0) {
        srDiv.innerHTML = html;
      } else {
        srDiv.innerHTML += html;
      }

      resultsDisplayed = end;
      document.getElementById('seeMoreBtn').style.display =
        (resultsDisplayed < allResults.length) ? '' : 'none';
    }

    function showMore() {
      displayResults(3);
    }
  </script>
</body>
</html>
